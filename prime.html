<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #aaa;
        }
        input, button {
            padding: 12px;
            margin: 10px;
            border-radius: 5px;
        }
        button {
            background: #4338ca;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Prime Number</h1>
        <p>Check whether a number is prime.</p>

        <input type="number" id="num" placeholder="Enter a number">
        <br>
        <button onclick="checkPrime()">Check Number</button>

        <p id="result"></p>
    </div>

    <script>
        function checkPrime() {
            let n = Number(document.getElementById("num").value);
            let result = document.getElementById("result");

            if (document.getElementById("num").value.trim() === "") {
                result.textContent = "Please enter a number.";
                return;
            }

            let prime = n >= 2;

            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    prime = false;
                    break;
                }
            }

            result.textContent = prime
                ? n + " is a Prime Number"
                : n + " is not a Prime Number";
        }
    </script>
</body>
</html>
